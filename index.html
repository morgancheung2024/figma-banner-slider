<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner 全屏轮播 · HTML 模块版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'zihunbiantaoti','PingFang SC','Microsoft YaHei',sans-serif;background:#000}
  .slider{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
  .slide{position:absolute;inset:0;opacity:0;transform:scale(1.015);transition:opacity .55s ease,transform .55s ease;display:flex;flex-direction:column;justify-content:center;padding:4vw 5vw;border:18px solid #000;overflow:hidden}
  .slide.active{opacity:1;transform:scale(1)}
  .s1{background:#39FF14;color:#000}
  .s2{background:#00E5FF;color:#000}
  .s3{background:#FEF000;color:#000}
  .s4{background:#DD9DFF;color:#000}
  .s5{background:#D1D1D1;color:#000}
  .s6{background:#2F2F2F;color:#000}
  .huge{font-weight:400;line-height:1.08;letter-spacing:-0.03em}
  /* slide1 */
  .s1 .t1{font-size:clamp(48px,14vw,230px)}
  .s1 .t2{font-size:clamp(32px,8.5vw,150px);background:#fff;display:inline-block;padding:.06em .22em;margin-top:.18em;box-shadow:0 0 0 3px #000 inset}
  .s1 .deco{position:absolute;right:5vw;bottom:7vh;width:120px;height:28px;display:flex;flex-direction:column;gap:14px;transform:rotate(-12deg)}
  .s1 .deco i{display:block;height:14px;background:#000;border-radius:2px}
  .s1 .deco i:last-child{width:70%;margin-left:auto}
  /* slide2 */
  .s2 .t1{font-size:clamp(38px,10vw,160px);line-height:1.06}
  .s2 .t2{font-size:clamp(18px,4.2vw,64px);margin-top:.35em}
  .s2 .bar{width:min(520px,62vw);height:clamp(18px,2.2vw,32px);background:#fff;border:2px solid #000;margin-top:1.2em}
  /* slide3 */
  .s3{justify-content:center;align-items:flex-end;text-align:right}
  .s3 .t1{font-size:clamp(42px,12vw,190px);text-align:right}
  .s3 .t2{font-size:clamp(18px,4.8vw,72px);margin-top:.25em;text-align:right}
  .s3 .bar{width:clamp(200px,31vw,380px);height:clamp(16px,2vw,28px);background:#fff;border:2px solid #000;margin-top:1em;align-self:flex-end}
  /* slide4 */
  .s4 .t1{font-size:clamp(42px,12vw,190px)}
  .s4 .t2{font-size:clamp(18px,4.6vw,68px);margin-top:.3em;line-height:1.28}
  .s4 .star{position:absolute;right:5vw;bottom:6vh;width:clamp(90px,14vw,190px);height:clamp(90px,14vw,190px);background:#fff;border:3px solid #000;border-radius:18px;display:grid;place-items:center;font-size:clamp(48px,7vw,110px)}
  .s4 .bar{position:absolute;right:5vw;top:62%;width:clamp(160px,22vw,280px);height:clamp(22px,2.8vw,38px);background:#fff;border:2px solid #000}
  /* slide5 */
  .s5 .badge{position:absolute;top:4vw;right:5vw;font-size:clamp(18px,5.2vw,78px);line-height:1}
  .s5 .t1{font-size:clamp(38px,11vw,170px);margin-top:1.2em}
  .s5 .t2{font-size:clamp(13px,2.1vw,30px);margin-top:.6em;line-height:1.55;letter-spacing:.02em}
  .s5 .icons{margin-top:1em;display:flex;gap:2.2em;font-size:clamp(18px,2.8vw,32px)}
  /* slide6 */
  .s6{color:#39FF14;border-color:#000}
  .s6-grid{display:grid;grid-template-columns:1.05fr 1.35fr;gap:4vw;align-items:center;height:100%;width:100%}
  .s6-left .t1{font-size:clamp(48px,10vw,160px);color:#39FF14;line-height:1.05}
  .s6-right{position:relative;height:min(72vh,760px);display:flex;align-items:center;justify-content:center}
  .phone{width:min(340px,28vw);height:min(68vh,620px);background:#111;border:12px solid #575757;border-radius:28px;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .phone img{width:100%;height:100%;object-fit:cover;display:block}
  .s6-extra{position:absolute;inset:0;pointer-events:none}
  .s6-extra img{position:absolute;object-fit:cover;border:2px solid #000;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .img-12322{right:-10%;top:8%;width:42%;height:58%;border-radius:6px}
  .img-17578{left:-8%;bottom:18%;width:52%;height:19%;border-radius:4px}
  .img-image1{left:12%;top:32%;width:11%;height:9%;border-radius:4px}
  .img-40497{left:8%;bottom:8%;width:7%;height:auto}
  .img-61944{right:18%;top:62%;width:7%;height:auto}
  .s6-bar{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);width:68%;height:18px;background:#000;border-radius:9px}
  @media(max-width:820px){
    .slide{border-width:10px;padding:6vw}
    .s6-grid{grid-template-columns:1fr;gap:3vh}
    .s6-right{height:52vh}
    .phone{width:min(300px,62vw);height:48vh}
    .s5 .badge{position:static;margin-bottom:.6em}
  }
  /* controls */
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:2px solid #000;border-radius:50%;background:rgba(255,255,255,.9);color:#000;font-size:22px;cursor:pointer;display:grid;place-items:center;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s}
  .arrow:hover{transform:translateY(-50%) scale(1.06)}
  .arrow.prev{left:18px}.arrow.next{right:18px}
  .dots{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:6}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid #000;background:rgba(255,255,255,.55);cursor:pointer}
  .dot.active{background:#000}
</style>
</head>
<body>
<div class="slider" id="slider">
  <!-- 1 数据担忧 -->
  <section class="slide s1 active">
    <div class="huge t1">数据担忧？</div>
    <div class="huge t2">免费&不设限！</div>
    <div class="deco" aria-hidden="true"><i></i><i></i></div>
  </section>
  <!-- 2 移动端标注 -->
  <section class="slide s2">
    <div class="huge t1">移动端也好用的<br>标注工具！</div>
    <div class="t2">完美适配 Orion 手机浏览器</div>
    <div class="bar" aria-hidden="true"></div>
  </section>
  <!-- 3 笔记吃灰 -->
  <section class="slide s3">
    <div class="huge t1">笔记吃灰？</div>
    <div class="t2">让笔记在新文章中自动复现！</div>
    <div class="bar" aria-hidden="true"></div>
  </section>
  <!-- 4 回顾费劲 -->
  <section class="slide s4">
    <div class="huge t1">回顾费劲？</div>
    <div class="t2">卡牌式主动回顾笔记<br>+ 解放眼睛被动听笔记</div>
    <div class="bar" aria-hidden="true"></div>
    <div class="star" aria-hidden="true">★</div>
  </section>
  <!-- 5 背单词 -->
  <section class="slide s5">
    <div class="badge">最佳实践</div>
    <div class="huge t1">背单词一条龙</div>
    <div class="t2">刷网文标生词 &nbsp;·&nbsp; 自动添加翻译备注 &nbsp;·&nbsp; 新文章中自动复现<br>卡牌式主动回顾笔记 & 解放眼睛被动听笔记</div>
    <div class="icons" aria-hidden="true"><span>◆</span><span>◆</span><span>◆</span></div>
  </section>
  <!-- 6 真实展示 -->
  <section class="slide s6">
    <div class="s6-grid">
      <div class="s6-left">
        <div class="huge t1">真实<br>展示</div>
      </div>
      <div class="s6-right">
        <div class="phone"><img src="41158-43093c.png" alt="手机标注示例"></div>
        <div class="s6-extra" aria-hidden="true">
          <img class="img-12322" src="12322.png" alt="">
          <img class="img-17578" src="17578-4d99ba.png" alt="">
          <img class="img-image1" src="image1.png" alt="">
          <img class="img-40497" src="40497.png" alt="">
          <img class="img-61944" src="61944.png" alt="">
        </div>
        <div class="s6-bar" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <button class="arrow prev" aria-label="上一张">‹</button>
  <button class="arrow next" aria-label="下一张">›</button>
  <div class="dots" id="dots"></div>
</div>
<script>
  const slides=[...document.querySelectorAll('.slide')];
  const dotsBox=document.getElementById('dots');
  const slider=document.getElementById('slider');
  let cur=0,timer=null;const INTERVAL=4000;
  slides.forEach((_,i)=>{const d=document.createElement('button');d.className='dot'+(i===0?' active':'');d.setAttribute('aria-label','第'+(i+1)+'张');d.addEventListener('click',()=>{show(i);restart()});dotsBox.appendChild(d)});
  const dots=[...dotsBox.children];
  function show(i){cur=(i+slides.length)%slides.length;slides.forEach((s,idx)=>s.classList.toggle('active',idx===cur));dots.forEach((d,idx)=>d.classList.toggle('active',idx===cur))}
  function next(){show(cur+1)}function start(){timer=setInterval(next,INTERVAL)}function stop(){clearInterval(timer)}function restart(){stop();start()}
  document.querySelector('.arrow.prev').addEventListener('click',()=>{show(cur-1);restart()});
  document.querySelector('.arrow.next').addEventListener('click',()=>{show(cur+1);restart()});
  slider.addEventListener('mouseenter',stop);slider.addEventListener('mouseleave',start);
  start();
</script>
</body>
</html>
